<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проектирование Домов | Архитектор-Конструктор</title>
    <script>
      // SPA 404 workaround: detect basePath from the first path segment
      // Works both on GitHub Pages (/master-marks/) and production (/)
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      var segments = path.replace(/^\//, "").split("/");
      var firstSeg = segments[0] || "";
      var knownRoutes = ["services", "projects", "about", "client-guide"];
      var basePath = (firstSeg && knownRoutes.indexOf(firstSeg) === -1 && firstSeg !== "index.html")
        ? "/" + firstSeg
        : "";
      var indexPath = basePath + "/index.html";

      var newPath =
        indexPath +
        (path !== basePath + "/" && path !== basePath
          ? "?p=" + encodeURIComponent(path + search + hash)
          : search + hash);
      window.location.replace(newPath);
    </script>
  </head>
  <body>
    <div style="padding: 20px; font-family: sans-serif; text-align: center">
      <h1>Загрузка...</h1>
      <p>
        Если страница не загрузилась,
        <a href="/">перейдите на главную</a>
      </p>
    </div>
  </body>
</html>
